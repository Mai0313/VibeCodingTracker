# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

# Ecosystems are staggered an hour apart: concurrent merges move each other's
# base, which blocks GITHUB_TOKEN from merging .github/workflows updates.

version: 2
updates:
  # Cargo (Rust)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Asia/Taipei"
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Rust toolchain (rust-toolchain.toml)
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Taipei"
    groups:
      rust-toolchain:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker (Dockerfile base image)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Asia/Taipei"
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Devcontainers
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Asia/Taipei"
    groups:
      devcontainers:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Asia/Taipei"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
