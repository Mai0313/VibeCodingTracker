name: Code Scanning

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions: write-all

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: GitLeaks Scanning
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trufflehog Scanning
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          # The Lob detector matches `(live|test)_` plus 35 word characters, so
          # any test named as a full sentence can hit it. Lob itself answers a
          # bogus key 401, but it sits behind Cloudflare, which serves
          # TruffleHog's own User-Agent a 403, and the detector reads 403 as
          # "key is live, just unbilled". Every match therefore reports as
          # verified. It cannot tell a real Lob key from a test name.
          # See https://github.com/Mai0313/discordbot/issues/472
          extra_args: --results=verified,unknown --exclude-detectors=lob

  codeql-scanning:
    name: CodeQL Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: CodeQL Initialize
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: rust

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v4.37.6
